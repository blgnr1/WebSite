<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FruiTrack - Gizlilik Politikası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --text-primary: #f0f0f8;
        --text-secondary: #a0a0c0;
        --accent-violet: #8b5cf6;
        --accent-violet-light: #a78bfa;
        --border-subtle: rgba(255, 255, 255, 0.06);
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        padding: 40px 24px;
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }
      h1 { font-family: "Space Grotesk", sans-serif; font-size: 36px; margin-bottom: 8px; margin-top: 100px; }
      p { color: var(--text-secondary); margin-bottom: 16px; font-size: 20px;}
      a { color: var(--accent-violet-light); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .back-btn { display: inline-block; margin-bottom: 32px; padding: 10px 20px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; border: 1px solid var(--border-subtle); color: var(--text-primary); transition: all 0.2s; position: absolute; left: 24px; top: 40px; }
      .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-btn">&larr; Ana Sayfaya Dön</a>
    <h1>FruiTrack - Gizlilik Politikası</h1>

  </body>
